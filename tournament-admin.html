<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>素数大富豪＋ 大会管理</title>
    <link rel="stylesheet" href="./tournament-admin.css?v=20260803-1" />
  </head>
  <body>
    <main class="admin-shell">
      <header>
        <div>
          <p class="kicker">PRIME DAIFUGO PLUS</p>
          <h1>大会管理</h1>
          <p>日程設定、進行確認、結果訂正、対戦スキップを行います。</p>
        </div>
        <span id="connectionStatus" class="connection-status">接続準備中</span>
      </header>

      <section class="admin-grid">
        <form id="scheduleForm" class="card">
          <h2>開催回を設定</h2>
          <label>管理トークン<input id="adminToken" type="password" autocomplete="current-password" required /></label>
          <label>大会名<input id="title" value="素数大富豪＋ 定期大会" maxlength="80" required /></label>
          <label>フォーマットID<input id="formatKey" value="plus-round-robin-v1" maxlength="64" required /></label>
          <label>ルール
            <select id="ruleKey">
              <option value="std-5-1">5枚 / ペナルティ1枚</option>
              <option value="std-7-1">7枚 / ペナルティ1枚</option>
              <option value="std-11-n-c" selected>11枚 / 通常</option>
              <option value="std-11-n-c-rev">初期革命 / 11枚</option>
              <option value="tetrad-11-n-c">四つ子素数 / 11枚</option>
              <option value="semiprime-11-n-c">半素数 / 11枚</option>
            </select>
          </label>
          <label>参加登録開始<input id="registrationOpensAt" type="datetime-local" required /></label>
          <label>大会開始<input id="startsAt" type="datetime-local" required /></label>
          <label>参加上限<input id="maxParticipants" type="number" min="2" max="10" value="10" required /></label>
          <button type="submit" class="primary">この日程で設定</button>
          <p class="note">同じフォーマットIDを使うと、同形式の開催回として履歴をまとめられます。</p>
        </form>

        <section class="card monitor-card">
          <div class="section-heading">
            <h2>現在の開催回</h2>
            <button id="refreshBtn" type="button">更新</button>
          </div>
          <div id="runSummary" class="run-summary empty">大会は設定されていません。</div>
          <div id="currentMatch" class="current-match empty">進行中の対戦はありません。</div>
          <h3>対戦一覧</h3>
          <div id="matchList" class="match-list"></div>
          <h3>順位</h3>
          <ol id="standings" class="standings"></ol>
        </section>
      </section>

      <section class="card">
        <div class="section-heading">
          <h2>開催履歴</h2>
          <button id="historyBtn" type="button">履歴を取得</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>

      <section id="messageLog" class="message-log" aria-live="polite"></section>
    </main>
    <script src="./tournament-admin.js?v=20260803-1"></script>
  </body>
</html>
